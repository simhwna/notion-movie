name: refresh-imdb-top250

on:
  schedule:
    # UTC 일요일 19:00 = KST 월요일 04:00
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx beautifulsoup4

      - name: Refresh top250 and sync Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python scripts/refresh_top250.py

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top250.json
          git diff --cached --quiet || git commit -m "chore: refresh imdb top250"
          git push
